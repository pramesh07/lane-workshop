# depends_on — task IDs that must be done (landed in your base) before lane start/land
# accept this task. Record it at creation: lane new card --depends-on T-A,T-B (validated +
# committed with the scaffold). A hand edit here is uncommitted until you commit it — invisible
# to task branches forked from HEAD, to lane land, and to teammates.
depends_on: [T-csv-export-wf9621]
# tests_mode — set automatically by `lane start` from the card's Tests: line.
#   red-green : full TDD cycle enforced; lane verify replays RED→GREEN ledger.
#   na        : no TDD ledger; lane verify + lane review skip test checks.
#               Card must have `Tests: N/A — <reason>` to trigger this.
#               Use `lane red --regression` inside red-green to commit a passing
#               test outside the ledger (non-ledger guard, verify ignores it).
#   refactor  : characterisation ledger (`Tests: refactor — <what stays green>`); lane red
#               commits a PASSING anchor, lane verify replays pass→pass and requires a
#               source change at GREEN.
tests_mode: red-green
